name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docsindexer
          POSTGRES_PASSWORD: docsindexer
          POSTGRES_DB: docsindexer
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Run migrations
        run: |
          PGPASSWORD=docsindexer psql -h localhost -U docsindexer -d docsindexer \
            -f infra/migrations/001_create_projects.sql
          PGPASSWORD=docsindexer psql -h localhost -U docsindexer -d docsindexer \
            -f infra/migrations/002_create_documents.sql
          PGPASSWORD=docsindexer psql -h localhost -U docsindexer -d docsindexer \
            -f infra/migrations/003_create_chunks.sql

      - name: Run tests
        env:
          DATABASE_URL: postgres://docsindexer:docsindexer@localhost:5432/docsindexer
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUST_LOG: info
        run: |
          cargo test --lib -- --test-threads=1

  build-docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f infra/Dockerfile -t docs-indexer:ci .

      - name: Verify binary
        run: docker run --rm docs-indexer:ci --version